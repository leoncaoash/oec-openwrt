
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  build-oec:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev libelf-dev python3 \
            python3-setuptools python3-yaml \
            python3-requests rsync unzip zlib1g-dev \
            file wget swig time xsltproc zstd \
            curl ca-certificates

      - name: Prepare OEC configuration
        run: |
          set -e
          cd openwrt

          test -s ../project/files/oec.mk
          test -s ../project/files/rk3566-onething-edge-cube.dts

          cat ../project/files/oec.mk \
            >> target/linux/rockchip/image/armv8.mk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_PACKAGE_kmod-rtw88-8822bu=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          EOF

          make defconfig

          grep -qx \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y' \
            .config

          grep -qx \
            'CONFIG_PACKAGE_kmod-rtw88-8822bu=y' \
            .config

          echo "OEC configuration: OK"

      - name: Build OpenWrt tools
        run: |
          cd openwrt
          make -j2 tools/install

      - name: Build OpenWrt toolchain
        run: |
          cd openwrt
          make -j2 toolchain/install

      - name: Prepare Linux kernel
        run: |
          cd openwrt
          make -j2 target/linux/prepare

      - name: Integrate OEC device tree
        shell: bash
        run: |
          set -euo pipefail

          KDIR=$(find openwrt/build_dir \
            -type d \
            -path '*/linux-*/arch/arm64/boot/dts/rockchip' \
            -print -quit)

          test -n "$KDIR"
          test -f "$KDIR/Makefile"

          cp project/files/rk3566-onething-edge-cube.dts \
            "$KDIR/"

          if ! grep -q \
            'rk3566-onething-edge-cube.dtb' \
            "$KDIR/Makefile"; then
            echo \
              'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-onething-edge-cube.dtb' \
              >> "$KDIR/Makefile"
          fi

          echo "OEC device tree integrated"

      - name: Build complete OpenWrt
        run: |
          cd openwrt
          make -j2

      - name: Collect firmware files
        shell: bash
        run: |
          set -euo pipefail

          KERNEL=$(find openwrt/build_dir \
            -type f \
            -path '*/linux-*/arch/arm64/boot/Image' \
            -print -quit)

          DTB=$(find openwrt/build_dir \
            -type f \
            -name 'rk3566-onething-edge-cube.dtb' \
            -print -quit)

          ROOTFS=$(find openwrt/build_dir \
            -type f \
            -name 'root.squashfs' \
            -print -quit)

          test -n "$KERNEL"
          test -n "$DTB"
          test -n "$ROOTFS"

          test -s "$KERNEL"
          test -s "$DTB"
          test -s "$ROOTFS"

          mkdir -p output

          cp "$KERNEL" output/kernel.img
          cp "$DTB" output/rockchip.dtb
          cp "$ROOTFS" output/rootfs.squashfs

          echo "OEC firmware files collected"

      - name: Verify firmware
        shell: bash
        run: |
          set -euo pipefail

          MAGIC_KERNEL=$(dd if=output/kernel.img \
            bs=1 skip=56 count=4 2>/dev/null |
            od -An -tx1 | tr -d ' \n')

          MAGIC_DTB=$(od -An -tx1 -N4 \
            output/rockchip.dtb | tr -d ' \n')

          MAGIC_ROOTFS=$(od -An -tx1 -N4 \
            output/rootfs.squashfs | tr -d ' \n')

          test "$MAGIC_KERNEL" = "41524d64"
          test "$MAGIC_DTB" = "d00dfeed"
          test "$MAGIC_ROOTFS" = "68737173"

          KERNEL_SIZE=$(stat -c%s output/kernel.img)
          DTB_SIZE=$(stat -c%s output/rockchip.dtb)
          ROOTFS_SIZE=$(stat -c%s output/rootfs.squashfs)

          test $((KERNEL_SIZE + DTB_SIZE)) -le 67108864
          test "$ROOTFS_SIZE" -le 268435456

          echo "===== Firmware files ====="
          ls -lh output/

          echo "===== SHA256 ====="
          sha256sum output/*

          echo "OEC firmware verification: OK"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OEC-OpenWrt-Firmware
          path: output/
          if-no-files-found: error
