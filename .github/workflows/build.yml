
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Check OEC source
        run: |
          set -e

          DTS=project/files/rk3566-onething-edge-cube.dts
          ROCKCHIP=openwrt/target/linux/rockchip

          test -s "$DTS"
          grep -q 'onething,edge-cube' "$DTS"
          test -f "$ROCKCHIP/image/armv8.mk"
          test -f "$ROCKCHIP/Makefile"

          echo "OEC device tree: OK"
          echo "OpenWrt Rockchip target: OK"
          echo "Source preparation: OK"

      - name: Save device tree
        uses: actions/upload-artifact@v4
        with:
          name: oec-source
          path: project/files/
