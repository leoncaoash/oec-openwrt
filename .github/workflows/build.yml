
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Download OEC device tree
        run: |
          mkdir -p oec
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/rockchip/rk3566-onething-edge-cube.dts \
            -o oec/rk3566-onething-edge-cube.dts

          test -s oec/rk3566-onething-edge-cube.dts

      - name: Save OEC device tree
        uses: actions/upload-artifact@v4
        with:
          name: oec-device-tree
          path: oec/
