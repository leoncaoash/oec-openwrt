
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  build-wireless:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget \
            swig time xsltproc zstd \
            curl ca-certificates

      - name: Configure OpenWrt
        run: |
          set -e
          cd openwrt

          cat ../project/files/oec.mk \
            >> target/linux/rockchip/image/armv8.mk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y
          CONFIG_PACKAGE_kmod-rtw88-8822bu=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          EOF

          make defconfig

          grep -qx \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y' \
            .config

          grep -qx \
            'CONFIG_PACKAGE_kmod-rtw88-8822bu=y' \
            .config

          echo "OEC wireless configuration: OK"

      - name: Build OpenWrt tools
        run: |
          cd openwrt
          make -j2 tools/install

      - name: Build OpenWrt toolchain
        run: |
          cd openwrt
          make -j2 toolchain/install

      - name: Prepare OpenWrt kernel
        run: |
          cd openwrt
          make -j2 target/linux/prepare

      - name: Integrate OEC device tree
        shell: bash
        run: |
          set -euo pipefail

          KDIR=$(find openwrt/build_dir \
            -type d \
            -path '*/linux-*/arch/arm64/boot/dts/rockchip' \
            -print -quit)

          test -n "$KDIR"
          test -f "$KDIR/Makefile"

          cp project/files/rk3566-onething-edge-cube.dts \
            "$KDIR/"

          if ! grep -q \
            'rk3566-onething-edge-cube.dtb' \
            "$KDIR/Makefile"; then
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-onething-edge-cube.dtb' \
              >> "$KDIR/Makefile"
          fi

      - name: Build OpenWrt kernel
        run: |
          cd openwrt
          make -j2 target/linux/compile

      - name: Build RTL8822BU driver
        run: |
          cd openwrt
          make -j2 V=s package/kernel/mac80211/compile

      - name: Verify RTL8822BU module
        shell: bash
        run: |
          set -euo pipefail

          MODULE=$(find openwrt/build_dir \
            -type f \
            -name 'rtw88_8822bu.ko' \
            -print -quit)

          test -n "$MODULE"
          test -s "$MODULE"

          mkdir -p output
          cp "$MODULE" output/

          echo "RTL8822BU driver compilation: OK"

      - name: Upload wireless driver
        uses: actions/upload-artifact@v4
        with:
          name: oec-rtl8822bu
          path: output/
