
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Register OEC device
        run: |
          set -e

          cat project/files/oec.mk \
            >> openwrt/target/linux/rockchip/image/armv8.mk

          echo "OEC device registered"

      - name: Configure OpenWrt
        run: |
          set -e
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y
          EOF

          make defconfig

          echo "===== OEC configuration ====="

          grep -x \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y' \
            .config

          if grep -q \
            '^CONFIG_TARGET_rockchip_armv8_DEVICE_armsom_sige7=y$' \
            .config; then
            echo "ERROR: Wrong device selected"
            exit 1
          fi

          echo "OEC build target configured successfully"

      - name: Save configuration
        uses: actions/upload-artifact@v4
        with:
          name: oec-build-config
          path: openwrt/.config
          include-hidden-files: true
