
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Prepare OEC kernel support
        shell: bash
        run: |
          set -euo pipefail

          ROCKCHIP=openwrt/target/linux/rockchip
          DTS=rk3566-onething-edge-cube.dts
          KDIR=arch/arm64/boot/dts/rockchip

          mkdir -p "$ROCKCHIP/files/$KDIR"
          mkdir -p "$ROCKCHIP/patches-6.12"

          cp "project/files/$DTS" \
            "$ROCKCHIP/files/$KDIR/$DTS"

          cat > "$ROCKCHIP/patches-6.12/999-oec-dtb.patch" <<'EOF'
          --- a/arch/arm64/boot/dts/rockchip/Makefile
          +++ b/arch/arm64/boot/dts/rockchip/Makefile
          @@ -1,3 +1,4 @@
           # SPDX-License-Identifier: GPL-2.0
          +dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-onething-edge-cube.dtb
          EOF

          echo "OEC kernel files prepared"

      - name: Download Linux source
        run: |
          curl -fL --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.112.tar.xz \
            -o linux.tar.xz
          tar -xf linux.tar.xz

      - name: Check kernel patch
        shell: bash
        run: |
          set -euo pipefail

          cd linux-6.12.112

          patch --dry-run -p1 \
            < ../openwrt/target/linux/rockchip/patches-6.12/999-oec-dtb.patch

          echo "OEC kernel patch: OK"

      - name: Save prepared files
        uses: actions/upload-artifact@v4
        with:
          name: oec-kernel-support
          path: |
            openwrt/target/linux/rockchip/files/
            openwrt/target/linux/rockchip/patches-6.12/999-oec-dtb.patch
