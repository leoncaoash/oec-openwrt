
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  build-dtb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            make bc bison flex \
            libssl-dev libelf-dev

      - name: Download Linux kernel
        run: |
          curl -fL --retry 3 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.112.tar.xz \
            -o linux.tar.xz
          tar -xf linux.tar.xz
          mv linux-6.12.112 linux

      - name: Prepare OEC device tree
        run: |
          cp files/rk3566-onething-edge-cube.dts \
            linux/arch/arm64/boot/dts/rockchip/

          echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-onething-edge-cube.dtb' \
            >> linux/arch/arm64/boot/dts/rockchip/Makefile

      - name: Compile device tree
        run: |
          cd linux
          make ARCH=arm64 defconfig
          make -j2 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            dtbs

          test -s \
            arch/arm64/boot/dts/rockchip/rk3566-onething-edge-cube.dtb

          echo "OEC DTB compilation successful"

      - name: Save OEC DTB
        uses: actions/upload-artifact@v4
        with:
          name: oec-dtb
          path: linux/arch/arm64/boot/dts/rockchip/rk3566-onething-edge-cube.dtb
