
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget \
            swig time xsltproc zstd \
            curl ca-certificates

      - name: Check build environment
        run: |
          set -e
          echo "===== Disk space ====="
          df -h .

          echo "===== Build tools ====="
          command -v gcc
          command -v flex
          command -v m4
          m4 --version | head -n 1

      - name: Configure OpenWrt
        run: |
          set -e
          cd openwrt

          cat ../project/files/oec.mk \
            >> target/linux/rockchip/image/armv8.mk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y
          EOF

          make defconfig

          grep -qx \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y' \
            .config

          echo "OEC target configured"

      - name: Build OpenWrt tools
        run: |
          cd openwrt
          make -j2 V=s tools/install

      - name: Build OpenWrt toolchain
        run: |
          cd openwrt
          make -j2 V=s toolchain/install

      - name: Verify cross compiler
        run: |
          set -e

          echo "===== Cross compiler ====="

          find openwrt/staging_dir \
            -type f \
            -name '*gcc' \
            -path '*/bin/*' \
            -print

          echo "===== Disk space ====="
          df -h .

      - name: Prepare OpenWrt kernel
        run: |
          cd openwrt
          make -j2 V=s target/linux/prepare

      - name: Integrate OEC device tree
        shell: bash
        run: |
          set -euo pipefail

          KDIR=$(find openwrt/build_dir \
            -type d \
            -path '*/linux-*/arch/arm64/boot/dts/rockchip' \
            -print -quit)

          test -n "$KDIR"
          test -f "$KDIR/Makefile"

          cp project/files/rk3566-onething-edge-cube.dts \
            "$KDIR/"

          if ! grep -q \
            'rk3566-onething-edge-cube.dtb' \
            "$KDIR/Makefile"; then

            printf '%s\n' \
              'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-onething-edge-cube.dtb' \
              >> "$KDIR/Makefile"
          fi

          echo "OEC device tree integrated"

      - name: Compile OpenWrt kernel
        run: |
          cd openwrt
          make -j2 V=s target/linux/compile

      - name: Verify OEC DTB
        shell: bash
        run: |
          set -euo pipefail

          DTB=$(find openwrt/build_dir \
            -name rk3566-onething-edge-cube.dtb \
            -type f -print -quit)

          test -n "$DTB"
          test -s "$DTB"

          mkdir -p output
          cp "$DTB" output/

          echo "OEC OpenWrt kernel DTB: OK"

      - name: Upload OEC DTB
        uses: actions/upload-artifact@v4
        with:
          name: oec-openwrt-dtb
          path: output/
