
name: OEC OpenWrt

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Add OEC device files
        shell: bash
        run: |
          set -e

          ROCKCHIP=openwrt/target/linux/rockchip

          test -s project/files/oec.mk
          test -s project/files/rk3566-onething-edge-cube.dts

          mkdir -p "$ROCKCHIP/files/arch/arm64/boot/dts/rockchip"

          cp project/files/rk3566-onething-edge-cube.dts \
            "$ROCKCHIP/files/arch/arm64/boot/dts/rockchip/"

          cat project/files/oec.mk \
            >> "$ROCKCHIP/image/armv8.mk"

          grep -q 'define Device/onething_oec' \
            "$ROCKCHIP/image/armv8.mk"

          echo "OEC device configuration: OK"
          echo "OEC device tree staging: OK"

      - name: Save prepared source
        uses: actions/upload-artifact@v4
        with:
          name: oec-prepared-files
          path: |
            openwrt/target/linux/rockchip/image/armv8.mk
            openwrt/target/linux/rockchip/files/
