name: Build OpenWrt OEC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-oec:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout OEC project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout OpenWrt 25.12.6
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            python3-yaml python3-requests rsync unzip zlib1g-dev file wget \
            swig time xsltproc zstd curl ca-certificates device-tree-compiler

      - name: Prepare OEC device
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          test -s ../project/files/oec.mk
          test -s ../project/files/rk3566-onething-edge-cube.dts
          test -s ../project/files/etc/uci-defaults/99-oec-network

          cat ../project/files/oec.mk >> target/linux/rockchip/image/armv8.mk

          mkdir -p files/etc/uci-defaults
          cp ../project/files/etc/uci-defaults/99-oec-network \
             files/etc/uci-defaults/
          chmod +x files/etc/uci-defaults/99-oec-network
          sh -n files/etc/uci-defaults/99-oec-network

      - name: Update package feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=256

          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-rtw88-8822bu=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_zerotier=y

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          EOF

          make defconfig

          for package in \
            kmod-usb-net-rtl8152 \
            kmod-rtw88-8822bu \
            wpad-basic-mbedtls \
            iw iwinfo luci luci-i18n-base-zh-cn \
            ttyd luci-app-ttyd \
            kmod-wireguard wireguard-tools \
            luci-proto-wireguard zerotier \
            block-mount kmod-fs-ext4; do

            grep -Fxq "CONFIG_PACKAGE_${package}=y" .config || {
              echo "MISSING PACKAGE: ${package}"
              exit 1
            }
          done

          grep -Fxq \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_onething_oec=y' .config

          echo "OEC configuration verified"

      - name: Build tools
        run: |
          cd openwrt
          make -j2 tools/install

      - name: Build toolchain
        run: |
          cd openwrt
          make -j2 toolchain/install

      - name: Prepare Linux kernel
        run: |
          cd openwrt
          make -j2 target/linux/prepare

      - name: Integrate OEC device tree
        shell: bash
        run: |
          set -euo pipefail

          KDIR=$(find openwrt/build_dir -type d \
            -path '*/linux-*/arch/arm64/boot/dts/rockchip' \
            -print -quit)

          test -n "$KDIR"
          test -f "$KDIR/Makefile"

          cp project/files/rk3566-onething-edge-cube.dts "$KDIR/"

          if ! grep -Fq 'rk3566-onething-edge-cube.dtb' "$KDIR/Makefile"; then
            printf '%s\n' \
              'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-onething-edge-cube.dtb' \
              >> "$KDIR/Makefile"
          fi

          echo "OEC DTS integrated: $KDIR"

      - name: Build complete OpenWrt
        run: |
          cd openwrt
          make -j1 V=s

      - name: Collect and verify firmware
        shell: bash
        run: |
          set -euo pipefail

          KERNEL=$(find openwrt/build_dir -type f \
            -path '*/linux-*/arch/arm64/boot/Image' \
            -print -quit)

          DTB=$(find openwrt/build_dir -type f \
            -name 'rk3566-onething-edge-cube.dtb' \
            -print -quit)

          ROOTFS=$(find openwrt/build_dir -type f \
            -name 'root.squashfs' \
            -print -quit)

          test -n "$KERNEL" && test -s "$KERNEL"
          test -n "$DTB" && test -s "$DTB"
          test -n "$ROOTFS" && test -s "$ROOTFS"

          mkdir -p output

          cp "$KERNEL" output/kernel.img
          cp "$DTB" output/rockchip.dtb
          cp "$ROOTFS" output/rootfs.squashfs

          kmagic=$(dd if=output/kernel.img bs=1 skip=56 count=4 \
            2>/dev/null | od -An -tx1 | tr -d ' \n')

          dmagic=$(od -An -tx1 -N4 output/rockchip.dtb | tr -d ' \n')
          smagic=$(od -An -tx1 -N4 output/rootfs.squashfs | tr -d ' \n')

          test "$kmagic" = '41524d64'
          test "$dmagic" = 'd00dfeed'
          test "$smagic" = '68737173'

          test $(($(stat -c%s output/kernel.img) + \
            $(stat -c%s output/rockchip.dtb))) -le 67108864

          test "$(stat -c%s output/rootfs.squashfs)" -le 268435456

          sha256sum output/* > output/SHA256SUMS

          echo "===== OEC FIRMWARE ====="
          ls -lh output/

      - name: Upload OEC firmware
        uses: actions/upload-artifact@v4
        with:
          name: OEC-OpenWrt-Firmware
          path: output/
          if-no-files-found: error
          retention-days: 30
